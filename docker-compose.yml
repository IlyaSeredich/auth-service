services:
  postgres:
    image: postgres:16
    container_name: postgres-as
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      APP_USER: '${APP_USER}'
      APP_USER_PASSWORD: '${APP_USER_PASSWORD}'
    ports:
      - '${DB_PORT}:5432'
    networks:
      - auth-service-network
    volumes:
      - postgres_auth_service_data:/var/lib/postgresql/data
      - ./docker/postgres/init/init-user.sh:/docker-entrypoint-initdb.d/init-user.sh


  keycloak-database:
    container_name: keycloak-database
    image: postgres:16
    restart: unless-stopped
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${KC_DB}
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    networks:
      - auth-service-network
    ports:
      - '5431:5432'


  keycloak-server:
    container_name: keycloak-server
    image: quay.io/keycloak/keycloak:26.4.5
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_ADMIN_URL: ${KC_HOSTNAME_ADMIN_URL}
      KC_HTTP_PORT: ${KC_PORT}
      KC_HOSTNAME_PORT: ${KC_PORT}
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_DATABASE: ${KC_DB}
      KC_DB_URL_HOST: keycloak-database
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_SCHEMA: public
      KC_HTTP_ENABLED: true
    restart: unless-stopped
    depends_on:
      - keycloak-database
    networks:
      - auth-service-network
    ports:
      - '${KC_PORT}:8080'

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: auth-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - '8081:8081'
    networks:
      - auth-service-network
    depends_on:
      keycloak-server:
        condition: service_healthy

volumes:
  keycloak_postgres:
  postgres_auth_service_data:

networks:
  auth-service-network: