databaseChangeLog:
  - changeSet:
      id: create-users
      author: "Ilya Seredich"
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: login
                  type: varchar(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(100)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_users_login
            tableName: users
            columns:
              - column:
                  name: login